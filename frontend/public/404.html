<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>LINKFORGE PRO</title>
  <!-- GitHub Pages SPA 리다이렉트: 404를 index.html로 전달 -->
  <script>
    // 현재 경로를 쿼리스트링으로 변환해 루트로 리다이렉트
    var l = window.location;
    var base = '/linkforge/';
    var path = l.pathname.slice(base.length) || '';
    var qs = path ? '?p=/' + path.replace(/&/g, '~and~') : '';
    l.replace(base + qs + l.hash);
  </script>
</head>
<body></body>
</html>
